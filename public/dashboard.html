<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accord Cron Health</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --border: #e4e7ec;
    --ok: #16794a; --ok-bg: #e7f6ee; --warn: #9a6200; --warn-bg: #fff4dc; --bad: #b42318; --bad-bg: #fde9e7;
    --off: #667085; --off-bg: #eef0f3; --accent: #2554c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1a1f29; --text: #e6e9ef; --muted: #98a2b3; --border: #2a3140;
      --ok: #5fd39a; --ok-bg: #143224; --warn: #f2c14e; --warn-bg: #3a2e10; --bad: #ff8a80; --bad-bg: #3d1a17;
      --off: #98a2b3; --off-bg: #252b37; --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }
  main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font-size: 24px; font-weight: 650; margin-top: 2px; }
  .tile.overall .v { text-transform: capitalize; }
  .reasons { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .s-healthy, .s-success { color: var(--ok); background: var(--ok-bg); }
  .s-delayed, .s-warning, .s-running, .s-skipped { color: var(--warn); background: var(--warn-bg); }
  .s-failing, .s-failed, .s-interrupted { color: var(--bad); background: var(--bad-bg); }
  .s-disabled { color: var(--off); background: var(--off-bg); }
  .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .why { font-size: 12px; color: var(--muted); margin-top: 4px; max-width: 360px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  input { font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); }
  .actions { display: flex; gap: 6px; }
  #history { margin-top: 16px; display: none; }
  #history h2 { font-size: 15px; margin: 0 0 8px; }
  .error { color: var(--bad); }
  @media (max-width: 640px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Accord Cron Health</h1>
    <div class="muted" id="updated">Loading…</div>
  </div>
  <div class="actions">
    <input id="token" type="password" placeholder="Admin token" aria-label="Admin token">
    <button id="saveToken">Save</button>
    <button id="refresh">Refresh</button>
  </div>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <div class="reasons" id="reasons" hidden></div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Job</th><th>Schedule</th><th>Status</th><th>Last run</th><th>Duration</th>
        <th class="num">Fetched</th><th class="num">Processed</th><th>Next run</th><th></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="9" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
  <section id="history">
    <h2 id="historyTitle"></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Started</th><th>Slot</th><th>Status</th><th>Duration</th><th class="num">Fetched</th><th class="num">Processed</th><th>Detail</th></tr></thead>
        <tbody id="historyRows"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  // Polls GET /api/health/crons every 15s. Everything is rendered with textContent (error text is untrusted).
  const REFRESH_MS = 15000;
  const TZ = 'Asia/Kolkata';
  let token = '';
  try { token = localStorage.getItem('cronHealthToken') || ''; } catch (e) {}
  document.getElementById('token').value = token;

  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) k === 'class' ? (n.className = v) : (n[k] = v);
    for (const c of kids) if (c != null) n.append(c instanceof Node ? c : String(c));
    return n;
  };
  const chip = (s) => el('span', { class: `chip s-${s}` }, s);
  const time = (d) => d ? new Date(d).toLocaleString('en-IN', { timeZone: TZ, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '—';
  const ago = (d) => {
    if (!d) return '';
    const s = Math.round((Date.now() - new Date(d)) / 1000);
    if (s < 0) { const m = Math.round(-s / 60); return m < 60 ? `in ${m} min` : `in ${Math.round(m / 60)} h`; }
    return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
  };
  const dur = (ms) => ms == null ? '—' : ms < 1000 ? `${ms} ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)} s` : `${(ms / 60000).toFixed(1)} min`;

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { Authorization: `Bearer ${token}`, ...(opts.headers || {}) } });
    if (r.status === 401) throw new Error('Unauthorized - enter the admin token');
    const body = await r.json();
    if (!r.ok && !body.jobs) throw new Error(body.error || `HTTP ${r.status}`);
    return body;
  }

  function renderTiles(h) {
    const t = document.getElementById('tiles');
    t.replaceChildren(
      el('div', { class: 'tile overall' }, el('div', { class: 'k' }, 'Overall'), el('div', { class: 'v' }, chip(h.overall))),
      ...['healthy', 'delayed', 'failing', 'disabled'].map((k) =>
        el('div', { class: 'tile' }, el('div', { class: 'k' }, k), el('div', { class: 'v' }, h.counts ? h.counts[k] : 0)))
    );
    const r = document.getElementById('reasons');
    r.hidden = !(h.reasons && h.reasons.length);
    r.textContent = (h.reasons || []).join(' · ');
  }

  function renderRows(jobs) {
    const body = document.getElementById('rows');
    if (!jobs.length) return body.replaceChildren(el('tr', {}, el('td', { colSpan: 9, class: 'muted' }, 'No jobs registered')));
    body.replaceChildren(...jobs.map((j) => {
      const lr = j.lastRun;
      const statusCell = el('td', {}, chip(j.status), j.running ? el('span', { class: 'chip s-running', style: 'margin-left:6px' }, 'running') : null,
        j.reasons.length ? el('div', { class: 'why' }, j.reasons.join(' · ')) : null);
      return el('tr', {},
        el('td', {}, el('strong', {}, j.name), j.criticality === 'critical' ? el('span', { class: 'tag' }, 'critical') : null,
          el('div', { class: 'why' }, j.jobKey)),
        el('td', {}, j.scheduleText.length > 3 ? `${j.scheduleText.slice(0, 3).join(', ')} +${j.scheduleText.length - 3}` : j.scheduleText.join(', ')),
        statusCell,
        el('td', {}, lr ? chip(lr.status) : '—', lr ? el('div', { class: 'why' }, `${time(lr.startedAt)} (${ago(lr.startedAt)})`) : null),
        el('td', {}, dur(lr && lr.durationMs)),
        el('td', { class: 'num' }, lr ? lr.recordsFetched : '—'),
        el('td', { class: 'num' }, lr ? lr.recordsProcessed : '—'),
        el('td', {}, time(j.nextRunAt), el('div', { class: 'why' }, ago(j.nextRunAt))),
        el('td', {}, el('div', { class: 'actions' },
          el('button', {
            onclick: (ev) => runNow(j, ev.currentTarget),
            disabled: j.status === 'disabled' || !!j.running,
            title: j.status === 'disabled' ? 'Job is disabled' : j.running ? 'Already running' : 'Start this job now',
          }, 'Run now'),
          el('button', { onclick: () => showHistory(j) }, 'History')))
      );
    }));
  }

  async function load() {
    try {
      const h = await api('/api/health/crons');
      renderTiles(h);
      renderRows(h.jobs || []);
      document.getElementById('updated').textContent = `Updated ${time(h.checkedAt)} · refreshes every ${REFRESH_MS / 1000}s`;
      if (openHistory) showHistory(openHistory, true);
    } catch (e) {
      document.getElementById('updated').replaceChildren(el('span', { class: 'error' }, e.message));
    }
  }

  // Start a job now. The API answers at once; the result shows up on the following refreshes.
  async function runNow(job, btn) {
    if (!confirm(`Run "${job.name}" now?`)) return;
    btn.disabled = true;
    btn.textContent = 'Starting…';
    try {
      await api(`/api/health/crons/${encodeURIComponent(job.jobKey)}/run`, { method: 'POST' });
      document.getElementById('updated').textContent = `Started ${job.name} - watch its status and History`;
      setTimeout(load, 1500); // quick refresh so "running" shows up
    } catch (e) {
      document.getElementById('updated').replaceChildren(el('span', { class: 'error' }, `Run ${job.name}: ${e.message}`));
      btn.disabled = false;
      btn.textContent = 'Run now';
    }
  }

  let openHistory = null;
  async function showHistory(job, quiet) {
    openHistory = job;
    const sec = document.getElementById('history');
    sec.style.display = 'block';
    document.getElementById('historyTitle').textContent = `${job.name} - last 20 runs`;
    const runs = await api(`/api/health/crons/${encodeURIComponent(job.jobKey)}/runs?limit=20`);
    document.getElementById('historyRows').replaceChildren(...(runs.length ? runs.map((r) => el('tr', {},
      el('td', {}, time(r.startedAt), r.trigger === 'manual' ? el('span', { class: 'tag' }, 'manual') : null),
      el('td', {}, r.scheduledFor ? time(r.scheduledFor) : '—'),
      el('td', {}, chip(r.status)),
      el('td', {}, dur(r.durationMs)),
      el('td', { class: 'num' }, r.recordsFetched),
      el('td', { class: 'num' }, r.recordsProcessed),
      el('td', { class: 'why' }, (r.error && r.error.message) || r.reason || '')
    )) : [el('tr', {}, el('td', { colSpan: 7, class: 'muted' }, 'No runs yet'))]));
    if (!quiet) sec.scrollIntoView({ behavior: 'smooth' });
  }

  document.getElementById('saveToken').onclick = () => {
    token = document.getElementById('token').value.trim();
    try { localStorage.setItem('cronHealthToken', token); } catch (e) {}
    load();
  };
  document.getElementById('refresh').onclick = load;
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
